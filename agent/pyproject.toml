[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacontrol-agent"
version = "0.3.0"
description = "Embedded DataAgent subsystem for DataControl"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sqlglot>=28.0.0,<29.0.0",
  "duckdb>=1.4,<2",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# MCP pulls pyjwt[crypto] and therefore cryptography. cryptography 49+ dropped
# CPython macOS x86_64 wheels; keep the newest line that still publishes a
# universal2 wheel so Intel Macs do not need a local Rust/OpenSSL toolchain.
mcp = ["mcp>=1.13,<2", "cryptography>=48.0.1,<49"]
dev = ["pytest>=9,<10"]
all = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.13,<2",
  "cryptography>=48.0.1,<49",
]

[project.scripts]
agent3 = "agent3.adapters.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
