[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacontrol"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# `agent/` is an independently versioned Python 3.14 package with its own CI gate.
# The Portal's Python 3.13 lint job must not parse or govern that package.
extend-exclude = ["agent"]

[tool.ruff.lint]
# FastAPI dependency injection in default arguments is intentional. Keep the
# Portal gate focused on syntax/runtime/import defects; Agent boundaries are
# verified independently under Python 3.14.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone samples/scripts add the repository root to sys.path before importing
# backend modules so they work from a fresh checkout on Windows/macOS/Linux.
"samples/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
