name: ci
on: [push, pull_request]
jobs:
  p0-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python samples/generate_demo_data.py
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/search_benchmark.py
